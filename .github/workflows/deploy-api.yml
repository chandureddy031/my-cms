name: Deploy API

# Redeploys the Render service when its folder changes on main (or on demand from the Actions tab).
on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_API_HOOK }}
        run: |
          test -n "$HOOK" || { echo "::error::Secret RENDER_API_HOOK is not set"; exit 1; }
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy started"
